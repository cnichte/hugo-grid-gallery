{{/* Module: layouts/hugo-grid-gallery-index/list.html */}}
{{ define "main" }}
  <div class="hugg">
    {{- with .Content -}}
      <div class="hugg-section-content">{{ . }}</div>
    {{- end -}}
    {{- partial "gallery-grid/list.html" (dict
      "page" .
      "role" (.Params.hugg.role | default "")
    ) -}}
  </div>
{{ end }}
