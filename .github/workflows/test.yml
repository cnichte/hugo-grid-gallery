name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hugo:
    name: Hugo ${{ matrix.hugo-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo-version:
          - 0.156.0
          - latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Run build and DOM tests
        run: npm test
